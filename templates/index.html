{% extends "base.html" %}

{% block content %}
<div class="dashboard">
    <h2>Dashboard Overview</h2>

    <!-- Stats Cards -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-icon blue">
                <i class="fas fa-file-shield"></i>
            </div>
            <div class="stat-info">
                <h3 id="compliancePolicyCount">-</h3>
                <p>Compliance Policies</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon green">
                <i class="fas fa-cog"></i>
            </div>
            <div class="stat-info">
                <h3 id="configPolicyCount">-</h3>
                <p>Configuration Policies</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon orange">
                <i class="fas fa-shield-virus"></i>
            </div>
            <div class="stat-info">
                <h3 id="securityPolicyCount">-</h3>
                <p>Security Intents</p>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon purple">
                <i class="fas fa-laptop"></i>
            </div>
            <div class="stat-info">
                <h3 id="deviceCount">-</h3>
                <p>Managed Devices</p>
            </div>
        </div>
    </div>

    <!-- Recent Policies -->
    <div class="content-section">
        <div class="section-header">
            <h3>Recent Policies</h3>
            <button class="btn btn-primary" onclick="loadPolicies()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
        <div id="recentPolicies" class="policy-list">
            <p class="text-muted">Loading policies...</p>
        </div>
    </div>

    <!-- Query Section -->
    <div class="content-section" id="querySection" style="display: none;">
        <div class="section-header">
            <h3>Advanced Hunting Query</h3>
            <button class="btn btn-secondary" onclick="hideQueryBuilder()">
                <i class="fas fa-times"></i> Close
            </button>
        </div>
        <div class="query-builder">
            <textarea id="queryInput" placeholder="Enter KQL query here..." rows="10"></textarea>
            <button class="btn btn-primary" onclick="executeQuery()">
                <i class="fas fa-play"></i> Run Query
            </button>
        </div>
        <div id="queryResults" class="query-results"></div>
    </div>

    <!-- Results Section -->
    <div class="content-section" id="resultsSection" style="display: none;">
        <div class="section-header">
            <h3 id="resultsTitle">Results</h3>
        </div>
        <div id="resultsContent"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Load dashboard data on page load
    document.addEventListener('DOMContentLoaded', function() {
        loadDashboard();
    });
</script>
{% endblock %}
