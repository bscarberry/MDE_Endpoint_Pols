<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Defender XDR Endpoint Policy Manager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="header-prompt">&gt;</span>
                <h1>defender<span class="text-green">X</span>dr<span class="terminal-cursor">_</span></h1>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" onclick="showDashboard(); return false;">
                    <i class="fas fa-home"></i>
                    <span class="nav-comment">//</span>
                    <span>dashboard</span>
                </a>
                <a href="#" class="nav-item" onclick="loadPolicies(); return false;">
                    <i class="fas fa-file-shield"></i>
                    <span class="nav-comment">//</span>
                    <span>endpoint_policies</span>
                </a>
                <a href="#" class="nav-item" onclick="loadDevices(); return false;">
                    <i class="fas fa-laptop"></i>
                    <span class="nav-comment">//</span>
                    <span>managed_devices</span>
                </a>
                <a href="#" class="nav-item" onclick="loadMachines(); return false;">
                    <i class="fas fa-server"></i>
                    <span class="nav-comment">//</span>
                    <span>defender_machines</span>
                </a>
                <a href="#" class="nav-item" onclick="loadAlerts(); return false;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span class="nav-comment">//</span>
                    <span>security_alerts</span>
                </a>
                <a href="#" class="nav-item" onclick="showQueryBuilder(); return false;">
                    <i class="fas fa-search"></i>
                    <span class="nav-comment">//</span>
                    <span>advanced_hunting</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="top-nav">
                    <a href="#" onclick="showDashboard(); return false;">
                        <i class="fas fa-home"></i>
                        <span class="nav-comment">//</span>
                        <span>home</span>
                    </a>
                    <a href="#" onclick="loadPolicies(); return false;">
                        <i class="fas fa-file-shield"></i>
                        <span class="nav-comment">//</span>
                        <span>policies</span>
                    </a>
                    <a href="#" onclick="loadAlerts(); return false;">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span class="nav-comment">//</span>
                        <span>alerts</span>
                    </a>
                </div>
                <button class="btn-primary" onclick="loadPolicies()">
                    <i class="fas fa-sync"></i>
                    refresh_policies()
                </button>
            </header>

            <div class="content-area">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Modal for Policy Details -->
    <div id="policyModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
